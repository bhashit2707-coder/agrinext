services:
  - type: web
    name: agrinext-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AGRINEXT_ENV
        value: production
      - key: AGRINEXT_COOKIE_SECURE
        value: "true"
      - key: AGRINEXT_COOKIE_SAMESITE
        value: "none"
      - key: AGRINEXT_ALLOWED_ORIGINS
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      - key: EARTHDATA_BEARER_TOKEN
        sync: false
